# Used by the build self-check (nginx -t -c) and by the panel's first boot: a
# configuration that parses on a machine with no sites and no certificates.
worker_processes 1;
pid /tmp/saopanel-nginx-test.pid;
error_log stderr warn;
events { worker_connections 16; }
http {
  include mime.types;
  default_type application/octet-stream;
  access_log off;
  client_body_temp_path /tmp/saopanel-nginx-test/body;
  proxy_temp_path /tmp/saopanel-nginx-test/proxy;
  server {
    listen 127.0.0.1:0;
    server_name _;
    location = /healthz { return 200 "ok\n"; }
    location = /nginx_status { stub_status; }
  }
}
