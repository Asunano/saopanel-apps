# Used only by the build's own self-check: nginx -t against a configuration that
# parses with no sites, no certificates and no writable log directory.
#
# Every path is absolute and single-level on purpose. nginx resolves a relative
# include against the directory of the config file it is reading, and creates
# only the leaf of a temp path — the first version of this file used
# `listen 127.0.0.1:0` (illegal in 1.31), a two-level temp path whose parent
# nobody creates, and `include conf/mime.types` that resolved to a directory the
# build stage does not have.
worker_processes 1;
pid /tmp/saopanel-nginx-test.pid;
error_log stderr warn;
events { worker_connections 16; }
http {
  default_type application/octet-stream;
  access_log off;
  client_body_temp_path /tmp/saopanel-nginx-test-body;
  proxy_temp_path /tmp/saopanel-nginx-test-proxy;
  server {
    listen 127.0.0.1:18080;
    server_name _;
    location = /healthz { return 200 "ok\n"; }
    location = /nginx_status { stub_status; }
  }
}
